# =============================================================================
# SICAE — Pipeline de integración continua
# Disparadores: push y pull request sobre main.
# El job "build-test" valida de punta a punta: instalación estricta del
# lockfile, generación/validación de Prisma, compilación de API y Web y
# tests unitarios. Ver documentación en infrastructure/ci/README.md.
# =============================================================================
name: CI SICAE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones obsoletas de la misma rama/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Install, build y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Equivale a `corepack enable`: instala la versión de pnpm declarada en
      # "packageManager" del package.json raíz. Debe ir ANTES de setup-node
      # para que la caché "cache: pnpm" encuentre el binario de pnpm.
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node 22 (con caché de pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependencias (lockfile estricto)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + validate (@sicae/api)
        run: |
          pnpm --filter @sicae/api prisma:generate
          pnpm --filter @sicae/api prisma:validate

      - name: Build API (NestJS)
        run: pnpm --filter @sicae/api build

      - name: Build Web (Vite)
        run: pnpm --filter @sicae/web build

      - name: Tests unitarias API (Jest)
        run: pnpm --filter @sicae/api test

  # ---------------------------------------------------------------------------
