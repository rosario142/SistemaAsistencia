# =============================================================================
# SICAE — Docker Compose (entorno local y despliegue básico)
# -----------------------------------------------------------------------------
# Uso desde la RAÍZ del repo (para que --env-file .env resuelva correctamente):
#
#   # Solo la base de datos (desarrollo local con `pnpm dev`):
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d postgres
#
#   # Stack completo compilado (postgres + api + web):
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d --build
#
#   # Con proxy inverso opcional (perfil "tls", puertos 80/443):
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml --profile tls up -d --build
#
# Servicios:
#   postgres  PostgreSQL 16 con volumen persistente y healthcheck.
#   api       API NestJS (Dockerfile.api) en :3000, sirve /api/v1.
#   web       SPA React compilada servida por nginx (Dockerfile.web) en :8080.
#   nginx     Proxy inverso opcional (perfil "tls") en :80/:443 → api + web.
# =============================================================================

name: sicae

services:
  # --- PostgreSQL 16 ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sicae
      POSTGRES_PASSWORD: sicae_secret
      POSTGRES_DB: sicae
    ports:
      # Expuesto para desarrollo local (psql, Prisma Studio, DBeaver...).
      # En producción, eliminar del mapa de puertos.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicae -d sicae"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sicae

  # --- API NestJS -------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        # Espera a que la BD esté sana antes de arrancar (evita carreras en
        # el arranque y en `prisma migrate deploy`).
        condition: service_healthy
    env_file:
      # Secretos del entorno (JWT_SECRET, SMTP_...) leídos de la raíz del repo.
      - ../../.env
    environment:
      # La app dentro de la red de Compose alcanza la BD por nombre de servicio.
      DATABASE_URL: postgresql://sicae:sicae_secret@postgres:5432/sicae?schema=public
      NODE_ENV: production
      PORT: 3000
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # La SPA en :8080 debe poder llamar a la API (CORS).
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      # Adjuntos de justificaciones: persisten fuera del contenedor.
      - uploads:/app/uploads
    networks:
      - sicae

  # --- SPA React (nginx sirviendo estáticos) ----------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        # URL de la API embebida en el bundle en tiempo de build.
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: unless-stopped
    # Siembra el volumen compartido "web_dist" con los estáticos compilados y
    # luego arranca nginx normalmente. Así el servicio "nginx" (perfil "tls")
    # puede servir la SPA directamente con infrastructure/nginx/default.conf.
    command: ["/bin/sh", "-c", "cp -a /usr/share/nginx/html/. /webdist/ && exec nginx -g 'daemon off;'"]
    volumes:
      - web_dist:/webdist
    ports:
      - "8080:80"
    networks:
      - sicae

  # --- Proxy inverso opcional (perfil "tls") ----------------------------------
  nginx:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configuración global (gzip, rate limiting, cabeceras) + servidores.
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Estáticos del SPA compartidos con el servicio "web".
      - web_dist:/usr/share/nginx/html:ro
      # Certificados TLS emitidos con certbot en el host.
      # Habilitar el bloque 443 comentado en default.conf antes de usar.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - sicae

volumes:
  pgdata:
  uploads:
  web_dist:

networks:
  sicae:
    driver: bridge
