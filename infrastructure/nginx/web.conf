# =============================================================================
# SICAE — conf del contenedor "web" (imagen sicae-web, Dockerfile.web)
# Solo sirve los estáticos del SPA compilados con fallback SPA.
# El proxy inverso y el rate limit viven en nginx.conf + default.conf
# (servicio "nginx" del compose, perfil "tls").
# =============================================================================
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compresión también a nivel de contenedor (por si se usa sin el proxy).
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;

  # Ocultar versión.
  server_tokens off;

  # Cabeceras de seguridad (básicas; las completas las añade el proxy externo).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Fallback SPA: el router del cliente resuelve las rutas en el navegador.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html sin caché: cambia en cada build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Assets con hash del bundle: caché inmutable por 1 año.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
