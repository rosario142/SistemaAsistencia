# =============================================================================
# SICAE — servidores virtuales por defecto
# Este archivo se monta en el servicio "nginx" del compose (perfil "tls").
# El contenedor "web" usa web.conf (solo estáticos, sin proxy).
# =============================================================================

# --- Servidor API: proxy inverso hacia NestJS ---------------------------------
server {
  listen 80;
  server_name api.sicae.local _;   # en producción: api.tudominio.edu

  # Adjuntos de justificaciones (multipart) hasta 20 MB.
  client_max_body_size 20m;

  # Rate limit por IP solo bajo /api/ (zona "api_limit" definida en nginx.conf:
  # 10 r/s; burst absorbe picos puntuales del marcado masivo).
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Cualquier otra ruta bajo el dominio de la API: 404 en JSON.
  location / {
    default_type application/json;
    return 404 '{"message":"Ruta no encontrada"}';
  }
}

# --- Servidor Web: SPA estática con fallback SPA ------------------------------
server {
  listen 80;
  server_name sicae.local _;   # en producción: tudominio.edu

  root /usr/share/nginx/html;
  index index.html;

  # Fallback SPA: toda ruta desconocida sirve index.html (router del cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html nunca se cachea: es la entrada del bundle con hash.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Recursos con hash del bundle: caché agresiva por 1 año.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}

