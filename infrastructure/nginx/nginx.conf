# =============================================================================
# SICAE — configuración GLOBAL de nginx
# Compresión, rate limiting, cabeceras de seguridad y ocultación de versión.
# Los servidores virtuales viven en conf.d/*.conf (default.conf / web.conf).
# En el contenedor "web" este archivo no se usa (la imagen trae el suyo propio);
# se monta en el servicio "nginx" del compose (perfil "tls").
# =============================================================================
user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;

  # Tamaño máximo de subida: adjuntos de justificaciones (PDF/imágenes).
  client_max_body_size 20m;

  # Ocultar la versión de nginx en cabeceras y páginas de error.
  server_tokens off;

  # --- Compresión -------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/csv
    application/json
    application/javascript
    application/xml
    application/vnd.ms-excel
    image/svg+xml;

  # --- Rate limiting ----------------------------------------------------------
  # Zona "api_limit": máximo 10 peticiones/segundo por IP (la zona se referencia
  # con `limit_req zone=api_limit` en los bloques location de default.conf).
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_status 429;
  limit_conn_status 429;

  # --- Cabeceras de seguridad (heredadas por todos los servidores) ------------
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # CSP básica: recursos solo del mismo origen; la SPA conecta a la API del
  # mismo dominio vía /api/ (o a la URL en VITE_API_URL, añadirla a connect-src).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  include /etc/nginx/conf.d/*.conf;
}
